    <script type="module">
        import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.js';

        function initLightbox(selector) {
            const lightbox = new PhotoSwipeLightbox({
                gallery: selector,
                children: 'a',
                counterEl: false,
                pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.js')
            });

            lightbox.on('uiRegister', function() {
                lightbox.pswp.ui.registerElement({
                    name: 'custom-caption',
                    order: 9,
                    isButton: false,
                    appendTo: 'root',
                    html: '',
                    onInit: (el, pswp) => {
                        pswp.on('change', () => {
                            const caption = pswp.currSlide.data.element.dataset.caption;
                            el.innerHTML = caption || '';
                        });
                    }
                });
            });

            lightbox.init();
        }

        // Initialise PhotoSwipe on feature images
        initLightbox('.feature-image');

        // Initialise Justified Gallery, then PhotoSwipe on the grid after layout is done
        $(document).ready(function() {
            $('#artwork-grid-id').justifiedGallery({
                rowHeight: 400,
                maxRowHeight: 600,
                margins: 16,
                lastRow: 'nojustify',
                captions: true
            }).on('jg.complete', function() {
                initLightbox('#artwork-grid-id');
            });

            $(window).on('resize', function() {
                $('#artwork-grid-id').justifiedGallery({
                    rowHeight: $(window).width() < 768 ? 200 : 400,
                    maxRowHeight: $(window).width() < 768 ? 300 : 600,
                    margins: 16,
                    lastRow: 'nojustify',
                    captions: false
                });
            });
        });
    </script>
